apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: voting-app
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend-dep
        image: cloudacademydevops/frontend:v11
        ports:
        - containerPort: 80
  strategy:
   type: RollingUpdate
   rollingUpdate:
     maxUnavailable: 1
